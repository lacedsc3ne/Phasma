name: CI (Release)
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore

    - name: Publish
      run: dotnet publish -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false .\PhasmaStrap\PhasmaStrap.csproj

    - name: Upload Artifact
      id: upload-artifact
      uses: actions/upload-artifact@v7
      with:
        name: PhasmaStrap (Release) (${{ github.sha }})
        path: .\PhasmaStrap\bin\Release\net6.0-windows\win-x64\publish\*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      # This fork doesn't have access to Bloxstrap Labs' SignPath organization, so releases here
      # are unsigned - Windows SmartScreen will flag them on first run. See the release notes
      # this step writes for the same disclaimer shown on manually-published releases.
      - name: Download artifact
        uses: actions/download-artifact@v6
        with:
          name: PhasmaStrap (Release) (${{ github.sha }})
          path: release

      - name: Rename binaries
        run: mv "release/PhasmaStrap.exe" "release/PhasmaStrap-${{ github.ref_name }}.exe"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release/PhasmaStrap-${{ github.ref_name }}.exe
          name: PhasmaStrap ${{ github.ref_name }}
          body: |
            **Note:** this build is unsigned (this fork does not have access to the SignPath code-signing service the upstream Bloxstrap project uses), so Windows SmartScreen will likely flag it on first run. Click "More info" then "Run anyway" to proceed.
